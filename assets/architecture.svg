<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 560" width="1180" height="560" role="img" aria-label="TwinOS architecture diagram">
  <title>TwinOS — three layers, one API</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="core" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="user" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="int" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#6d28d9"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
    <filter id="glow">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M 36 0 L 0 0 0 36" fill="none" stroke="#10b981" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1180" height="560" fill="url(#bg)"/>
  <rect width="1180" height="560" fill="url(#grid)"/>

  <!-- layer bands -->
  <rect x="40" y="40" width="1100" height="130" rx="18" fill="#0f172a" stroke="#3b82f6" stroke-opacity="0.4" stroke-width="1.5"/>
  <text x="70" y="72" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#93c5fd" letter-spacing="2">LAYER 1 · USER</text>

  <rect x="40" y="200" width="1100" height="180" rx="18" fill="#0f172a" stroke="#10b981" stroke-opacity="0.5" stroke-width="1.5"/>
  <text x="70" y="232" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#6ee7b7" letter-spacing="2">LAYER 2 · TWINOS CORE (Supabase)</text>

  <rect x="40" y="410" width="1100" height="120" rx="18" fill="#0f172a" stroke="#a78bfa" stroke-opacity="0.4" stroke-width="1.5"/>
  <text x="70" y="442" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#c4b5fd" letter-spacing="2">LAYER 3 · INTEGRATIONS</text>

  <!-- User boxes -->
  <g filter="url(#sh)">
    <g transform="translate(90,88)">
      <rect width="150" height="62" rx="12" fill="url(#user)"/>
      <text x="75" y="30" text-anchor="middle" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="15" font-weight="700" fill="#fff">Jack</text>
      <text x="75" y="50" text-anchor="middle" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="11" fill="#dbeafe">Telegram Desk</text>
    </g>
    <g transform="translate(270,88)">
      <rect width="170" height="62" rx="12" fill="url(#user)"/>
      <text x="85" y="30" text-anchor="middle" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="15" font-weight="700" fill="#fff">Dashboard</text>
      <text x="85" y="50" text-anchor="middle" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="11" fill="#dbeafe">Lovable UI</text>
    </g>
    <g transform="translate(470,88)">
      <rect width="150" height="62" rx="12" fill="url(#user)"/>
      <text x="75" y="30" text-anchor="middle" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="15" font-weight="700" fill="#fff">ABDUL</text>
      <text x="75" y="50" text-anchor="middle" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="11" fill="#dbeafe">AI assistant</text>
    </g>
  </g>

  <!-- Core boxes -->
  <g filter="url(#sh)">
    <g transform="translate(90,260)">
      <rect width="200" height="92" rx="14" fill="url(#core)"/>
      <text x="100" y="34" text-anchor="middle" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="16" font-weight="800" fill="#fff">Postgres</text>
      <text x="100" y="56" text-anchor="middle" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" fill="#d1fae5">the mind</text>
      <text x="100" y="76" text-anchor="middle" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="10" fill="#a7f3d0">tables · RLS · triggers</text>
    </g>
    <g transform="translate(320,260)">
      <rect width="230" height="92" rx="14" fill="url(#core)"/>
      <text x="115" y="34" text-anchor="middle" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="16" font-weight="800" fill="#fff">Edge Functions</text>
      <text x="115" y="56" text-anchor="middle" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" fill="#d1fae5">the rules</text>
      <text x="115" y="76" text-anchor="middle" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="10" fill="#a7f3d0">11 functions · Deno</text>
    </g>
    <g transform="translate(580,260)">
      <rect width="200" height="92" rx="14" fill="url(#core)"/>
      <text x="100" y="34" text-anchor="middle" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="16" font-weight="800" fill="#fff">pg_cron</text>
      <text x="100" y="56" text-anchor="middle" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" fill="#d1fae5">the clock</text>
      <text x="100" y="76" text-anchor="middle" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="10" fill="#a7f3d0">every minute</text>
    </g>
    <g transform="translate(810,260)">
      <rect width="200" height="92" rx="14" fill="url(#core)"/>
      <text x="100" y="34" text-anchor="middle" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="16" font-weight="800" fill="#fff">Storage</text>
      <text x="100" y="56" text-anchor="middle" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" fill="#d1fae5">media ≤45 MB</text>
      <text x="100" y="76" text-anchor="middle" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="10" fill="#a7f3d0">clips · thumbs</text>
    </g>
  </g>

  <!-- Integration boxes -->
  <g filter="url(#sh)">
    <g transform="translate(90,450)">
      <rect width="170" height="58" rx="12" fill="url(#int)"/>
      <text x="85" y="26" text-anchor="middle" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#fff">Signal bot</text>
      <text x="85" y="46" text-anchor="middle" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="10" fill="#e9d5ff">TradingView</text>
    </g>
    <g transform="translate(290,450)">
      <rect width="170" height="58" rx="12" fill="url(#int)"/>
      <text x="85" y="26" text-anchor="middle" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#fff">@EzyOps_bot</text>
      <text x="85" y="46" text-anchor="middle" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="10" fill="#e9d5ff">Telegram</text>
    </g>
    <g transform="translate(490,450)">
      <rect width="170" height="58" rx="12" fill="url(#int)"/>
      <text x="85" y="26" text-anchor="middle" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#fff">printezy board</text>
      <text x="85" y="46" text-anchor="middle" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="10" fill="#e9d5ff">ad clicks (read)</text>
    </g>
    <g transform="translate(690,450)">
      <rect width="170" height="58" rx="12" fill="url(#int)"/>
      <text x="85" y="26" text-anchor="middle" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#fff">PC worker</text>
      <text x="85" y="46" text-anchor="middle" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="10" fill="#e9d5ff">GPU · clips</text>
    </g>
    <g transform="translate(890,450)">
      <rect width="170" height="58" rx="12" fill="url(#int)"/>
      <text x="85" y="26" text-anchor="middle" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#fff">Sales bot</text>
      <text x="85" y="46" text-anchor="middle" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="10" fill="#e9d5ff">Phase 8</text>
    </g>
  </g>

  <!-- connectors: user -> core -->
  <g stroke="#64748b" stroke-width="1.6" fill="none" opacity="0.85">
    <path d="M 165 150 L 165 200" />
    <path d="M 355 150 L 355 200" />
    <path d="M 545 150 L 545 200" />
    <path d="M 90 119 L 60 119 L 60 296 L 90 296" />
  </g>
  <text x="100" y="188" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="10" fill="#94a3b8">one API · one set of rules</text>

  <!-- connectors: integrations -> core -->
  <g stroke="#64748b" stroke-width="1.6" fill="none" opacity="0.85">
    <path d="M 175 450 L 175 400 L 190 352" />
    <path d="M 375 450 L 375 400 L 435 352" />
    <path d="M 575 450 L 575 400 L 640 352" />
    <path d="M 775 450 L 775 400 L 910 352" />
    <path d="M 975 450 L 975 400 L 435 352" />
  </g>

  <!-- central hub glow -->
  <circle cx="590" cy="306" r="150" fill="#10b981" opacity="0.05" filter="url(#glow)"/>
</svg>
