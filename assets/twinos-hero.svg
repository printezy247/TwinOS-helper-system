<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" role="img" aria-label="TwinOS hero banner">
  <title>TwinOS — EzyMap's Operating System</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="55%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#022c22"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="42%" r="58%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.42"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="title" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#a7f3d0"/>
      <stop offset="55%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="chip" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="drop" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
    <filter id="glowf">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#10b981" stroke-opacity="0.09" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="340" fill="url(#bg)"/>
  <rect width="1200" height="340" fill="url(#glow)"/>
  <rect width="1200" height="340" fill="url(#grid)"/>

  <!-- floating orbs -->
  <circle cx="180" cy="90" r="6" fill="#34d399" opacity="0.6" filter="url(#glowf)"/>
  <circle cx="1040" cy="250" r="5" fill="#60a5fa" opacity="0.5" filter="url(#glowf)"/>
  <circle cx="980" cy="80" r="4" fill="#f59e0b" opacity="0.5" filter="url(#glowf)"/>
  <circle cx="260" cy="260" r="4" fill="#a78bfa" opacity="0.45" filter="url(#glowf)"/>

  <!-- 3D extruded title -->
  <g filter="url(#drop)">
    <text x="600" y="155" text-anchor="middle" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="104" font-weight="900" letter-spacing="-2" fill="#022c22" transform="translate(7,8)">TwinOS</text>
    <text x="600" y="155" text-anchor="middle" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="104" font-weight="900" letter-spacing="-2" fill="url(#title)">TwinOS</text>
  </g>

  <!-- subtitle -->
  <text x="600" y="195" text-anchor="middle" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="20" font-weight="500" fill="#cbd5e1" letter-spacing="0.5">EzyMap's Operating System — AI Telegram automation for gold trading</text>
  <text x="600" y="222" text-anchor="middle" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#64748b">Draft · Comply · Approve · Publish · Track — so Jack focuses on maps, TikTok &amp; community</text>

  <!-- chips -->
  <g font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="600">
    <g transform="translate(250,262)">
      <rect x="0" y="0" width="118" height="30" rx="15" fill="url(#chip)" stroke="#334155"/>
      <text x="59" y="20" text-anchor="middle" fill="#34d399">Supabase</text>
    </g>
    <g transform="translate(382,262)">
      <rect x="0" y="0" width="104" height="30" rx="15" fill="url(#chip)" stroke="#334155"/>
      <text x="52" y="20" text-anchor="middle" fill="#60a5fa">Lovable</text>
    </g>
    <g transform="translate(498,262)">
      <rect x="0" y="0" width="92" height="30" rx="15" fill="url(#chip)" stroke="#334155"/>
      <text x="46" y="20" text-anchor="middle" fill="#f59e0b">Deno</text>
    </g>
    <g transform="translate(602,262)">
      <rect x="0" y="0" width="104" height="30" rx="15" fill="url(#chip)" stroke="#334155"/>
      <text x="52" y="20" text-anchor="middle" fill="#a78bfa">Python</text>
    </g>
    <g transform="translate(718,262)">
      <rect x="0" y="0" width="132" height="30" rx="15" fill="url(#chip)" stroke="#334155"/>
      <text x="66" y="20" text-anchor="middle" fill="#f472b6">TypeScript</text>
    </g>
    <g transform="translate(862,262)">
      <rect x="0" y="0" width="92" height="30" rx="15" fill="url(#chip)" stroke="#334155"/>
      <text x="46" y="20" text-anchor="middle" fill="#22d3ee">Telegram</text>
    </g>
  </g>

  <!-- bottom scan line -->
  <rect x="0" y="336" width="1200" height="4" fill="#10b981" opacity="0.6"/>
</svg>
