# TwinOS Supabase project (Phase 0, "the mind").
# project_id is filled in by `supabase link --project-ref <ref>` once Jack has
# created the TwinOS project in his own Supabase account (UPGRADE-PLAN §8,
# decision 10). It is deliberately left blank here: no project exists yet.
project_id = ""

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 15

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[auth]
enabled = true
site_url = "http://127.0.0.1:3000"
jwt_expiry = 3600
enable_signup = false

[studio]
enabled = true
port = 54323

[storage]
enabled = true
file_size_limit = "45MiB"
