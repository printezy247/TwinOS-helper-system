# TwinOS Supabase project (Phase 0, "the mind").
# project_id is only the CLI's local name for this project (it labels the local
# Docker stack); the real project ref lives in supabase/.temp after
# `supabase link --project-ref <ref>`. It must be non-empty or every CLI command
# fails with "Missing required field in config: project_id".
project_id = "twinos"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 17

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[auth]
enabled = true
site_url = "http://127.0.0.1:3000"
jwt_expiry = 3600
enable_signup = false

[studio]
enabled = true
port = 54323

[storage]
enabled = true
file_size_limit = "45MiB"
