name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  functions:
    name: deno check (supabase/functions)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: supabase/functions
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: deno check
        run: deno check --config deno.json _shared/*.ts */index.ts
      - name: deno lint
        run: deno lint --config deno.json
      - name: deno test (pure modules only)
        run: deno test --config deno.json --allow-env _shared/

  workers:
    name: python unittest (workers/pc, apps/mcp)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: cross-file consistency
        run: python3 tests/check_consistency.py
      - name: scripts (mint-keys.sh never prints a key)
        run: python3 -m unittest discover -v -s tests -p "test_*.py"
      - name: workers/pc
        working-directory: workers/pc
        run: python3 -m unittest discover -v -p "test_*.py"
      - name: apps/mcp (skipped when absent)
        run: |
          if [ -d apps/mcp ]; then
            cd apps/mcp && python3 -m unittest discover -v -p "test_*.py"
          else
            echo "apps/mcp not present yet; skipping"
          fi
      - name: byte-compile
        run: python3 -m compileall -q workers

  sql:
    name: sql (migrations + seed + smoke against a real Postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: twinos
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
    env:
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/twinos
    steps:
      - uses: actions/checkout@v4
      - name: install psql client
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
      # The migrations create the anon / authenticated / service_role roles
      # themselves when they are missing, so a plain Postgres works.
      - name: apply migrations and seed, then run the smoke test
        run: |
          set -euo pipefail
          for f in supabase/migrations/*.sql; do
            echo "== $f"
            psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -q -f "$f"
          done
          echo "== seed.sql"
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -q -f supabase/seed.sql
          echo "== tests/smoke.sql"
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -q -f supabase/tests/smoke.sql
      # The functions reach Postgres through supabase-js, so a wrong column name
      # is a runtime error `deno check` cannot see. Compare what the code uses
      # with the schema the migrations just built.
      - name: edge functions only use tables, columns and upsert targets that exist
        run: |
          set -euo pipefail
          psql "$DATABASE_URL" -At -f tests/schema_dump.sql > "$RUNNER_TEMP/schema.json"
          python3 tests/check_schema_usage.py "$RUNNER_TEMP/schema.json"
      # The seed's post skeletons, the locked brand lines, the renderer and the
      # compliance engine must agree: every template has to render into a post
      # with no blocking finding, in English and Malay.
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: every post template renders and passes the compliance engine
        run: |
          set -euo pipefail
          psql "$DATABASE_URL" -At -f tests/templates_dump.sql > "$RUNNER_TEMP/templates.json"
          deno run --allow-read --allow-env --config supabase/functions/deno.json \
            tests/check_templates.ts "$RUNNER_TEMP/templates.json"
      - name: sqlfluff (advisory)
        continue-on-error: true
        run: |
          pipx run sqlfluff lint supabase/migrations supabase/tests --dialect postgres || true

  secrets:
    name: no secrets in files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: grep tracked files for token shapes
        run: |
          set -e
          # Only files git tracks: a __pycache__ .pyc on a dev machine can hold a
          # placeholder like twk_pc_worker_000...0 that would trip this and is
          # not a secret.
          if git ls-files -z | xargs -0 grep -nIE \
               -e '[0-9]{8,10}:AA[0-9A-Za-z_-]{30,}' \
               -e 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9\.[A-Za-z0-9_-]{40,}' \
               -e 'twk_(abdul|pc_worker|ezyai)_[0-9a-f]{40}' ; then
            echo "secret-shaped string in a tracked file"; exit 1
          fi
          echo "clean"
      - name: a key must never be all zeros or all the same character
        run: |
          set -e
          if git ls-files -z | xargs -0 grep -nIE 'twk_[a-z_]+_(0{40}|a{40}|f{40})' ; then
            echo "placeholder-shaped key in a tracked file"; exit 1
          fi
          echo "no placeholders"
